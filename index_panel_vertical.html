<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel de administración de inventario · selectshop</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<link rel="stylesheet" href="css/panel.css">
</head>
<body>
<div id="app" class="first"></div>
<div id="tip" role="tooltip"></div>
<script src="data/dashboard_data.js"></script>
<script src="js/engine.js"></script>
<script src="js/kit.js"></script>
<script>
(function () {
'use strict';
var D = window.DASHBOARD_DATA, app = document.getElementById('app'), tip = document.getElementById('tip');
if (!D) { app.innerHTML = '<div class="wrap"><div class="card sec">No se encontraron los datos (data/dashboard_data.js).</div></div>'; return; }

/* ---------- motor y componentes compartidos (js/engine.js, js/kit.js) ---------- */
var E = InvEngine.create(D), K = Kit.create(D);
var nf = K.nf, mf = K.mf, esc = K.esc, pz = K.pz, money = K.money, money0 = K.money0, sg = K.sg, sgm = K.sgm, pcs = K.pcs, arrow = K.arrow, cls = K.cls, dl = K.dl, dow = K.dow,
    tipAttr = K.tipAttr, storeCell = K.storeCell, skuBtn = K.skuBtn, two = K.two, comboChart = K.comboChart, donutSection = K.donutSection, barlist = K.barlist, inSet = E.inSet;
var ND = E.ND, iDisp = E.iDisp, iRes = E.iRes;

/* ---------- estado ---------- */
var S = { mode: 'all', et: 't', ch: -1, ts: [], cs: [], us: [], q: '', ds: [], sort: 'total', lrB: 'all', open: null, showNew: false };
var cache = {};
function setS(o) { for (var k in o) S[k] = o[k]; schedule(); }
var pend = false;
function schedule() { if (pend) return; pend = true; var done = false; function go() { if (done) return; done = true; pend = false; render(); } requestAnimationFrame(go); setTimeout(go, 60); }  // rAF no corre en pestañas ocultas: el temporizador garantiza el redibujado

function srcFilter() { return E.srcFilter(S); }
function erpBase() { return E.erpBase(S); }
function options(sf) { return E.options(sf); }
function compute() { return E.compute(S); }


/* ---------- vista ---------- */
function render() {
  var scrollY = window.scrollY, C = compute(), h = '', sel = C.sel, d1 = C.d1, d0 = C.d0, pv = C.pv, i;
  var invU = C.invU, invV = C.invV, A = C.A, eb = C.sf >= 0 && S.mode === 'erp' ? erpBase() : 0;
  var subLbl = S.mode === 'erp' ? (S.et === 'd' ? ' · Disponible para la venta' : S.et === 'r' ? ' · Reservado' : ' · Total') : '';

  h += K.header({ S: S, C: C, iDisp: iDisp, iRes: iRes, title: 'Panel de administración de inventario', sub: 'ERP y Plataformas', showUb: false });

  /* KPIs: siempre piezas y valor */
  var cu = invU[d1], cv = invV[d1], per = C.per;
  var kp = [];
  kp.push('<div class="card kpi" style="--c:var(--red)"><div class="k">Inventario actual</div><div class="row"><span class="big v1">' + pz(cu) + '</span><span class="u">pzs</span></div><div class="row"><span class="big v2">' + money(cv) + '</span><span class="u">a costo</span></div><div class="n num">al ' + dl(d1) + subLbl + (C.sf < 0 ? ' · ERP ' + pz(C.A(0, d1).q) + ' · Plataformas ' + pz(C.A(1, d1).q) : '') + '</div></div>');
  if (pv >= 0) {
    var du = cu - invU[pv], dv = cv - invV[pv], dp = invU[pv] ? du / invU[pv] * 100 : 0, dpv = invV[pv] ? dv / invV[pv] * 100 : 0, c0 = du > 0 ? 'var(--in)' : du < 0 ? 'var(--out)' : '#999';
    kp.push('<div class="card kpi" style="--c:' + c0 + '"><div class="k">' + (du > 0 ? 'Aumentó el inventario' : du < 0 ? 'Bajó el inventario' : 'Inventario sin cambio') + '</div><div class="row ' + cls(du) + '"><span class="big v1">' + arrow(du) + ' ' + sg(du) + '</span><span class="u">pzs · ' + pcs(dp) + '</span></div><div class="row ' + cls(dv) + '"><span class="big v2" style="color:inherit">' + sgm(dv) + '</span><span class="u">' + pcs(dpv) + '</span></div><div class="n num">vs ' + dl(pv) + ' (' + pz(invU[pv]) + ' pzs · ' + money(invV[pv]) + ')</div></div>');
  } else kp.push('<div class="card kpi" style="--c:#B8C2CE"><div class="k">Variación vs corte anterior</div><div class="row"><span class="big v1">—</span></div><div class="n">Sin corte anterior para comparar' + (S.mode === 'erp' && S.et !== 't' ? ' (disponible/reservado solo tiene un corte)' : '') + '</div></div>');
  kp.push('<div class="card kpi" style="--c:var(--navy)"><div class="k">Movimiento del periodo · ' + dl(C.ps) + ' → ' + dl(d1) + '</div><div class="row up"><span class="big" style="font-size:18px">▲ ' + pz(per.e) + '</span><span class="u">pzs entradas · <b class="num">' + money(per.ve) + '</b></span></div><div class="row dn"><span class="big" style="font-size:18px">▼ ' + pz(per.s) + '</span><span class="u">pzs salidas · <b class="num">' + money(per.vs) + '</b></span></div><div class="n">Neto ' + sg(per.e - per.s) + ' pzs · ' + sgm(per.ve - per.vs) + '</div></div>');
  var nq = C.news.reduce(function (a, r) { return a + r.q; }, 0), nv = C.news.reduce(function (a, r) { return a + r.v; }, 0);
  kp.push('<div class="card kpi" style="--c:var(--violet);background:#FBF9FF"><div class="k" style="display:flex;justify-content:space-between;align-items:center;gap:8px">Nuevos SKU' + (pv >= 0 ? '<button type="button" data-a="newl" aria-expanded="' + S.showNew + '" style="all:unset;cursor:pointer;font-size:11px;font-weight:600;color:#1F5FAE;text-decoration:underline;text-underline-offset:2px;white-space:nowrap;text-transform:none;letter-spacing:0">' + (S.showNew ? 'Ocultar lista' : 'Ver lista') + '</button>' : '') + '</div><div class="row"><span class="big v1" style="color:var(--violet-t)">' + (pv >= 0 ? nf.format(C.news.length) : '—') + '</span><span class="u">SKU</span></div>' + (pv >= 0 ? '<div class="row"><span class="big v2" style="color:var(--gold-t)">' + pz(nq) + '</span><span class="u">pzs · <b class="num">' + money(nv) + '</b></span></div><div class="n">sin existencia el ' + dl(pv) + '</div>' : '<div class="n">Sin corte anterior para comparar</div>') + '</div>');
  h += '<section class="kpis" aria-label="Indicadores">' + kp.join('') + '</section>';
  if (S.showNew && pv >= 0) {
    h += '<section class="card sec" aria-label="Nuevos SKU"><div class="sechead"><div class="l"><h2 class="tag" style="background:var(--violet)">Nuevos SKU</h2><span class="sub">' + nf.format(C.news.length) + ' SKU con existencia al ' + dl(d1) + ' que no tenían el ' + dl(pv) + ' · ' + pz(nq) + ' pzs · ' + money(nv) + ' · mostrando hasta 200 por valor</span></div><button type="button" class="seg" data-a="newl" style="color:var(--ink);border:1px solid var(--ink);height:30px">Ocultar</button></div>';
    if (C.news.length) h += '<div class="tw"><div class="tb" style="--cols:30px 140px minmax(0,1fr) 150px 110px 140px;--mw:820px"><div class="th"><div>#</div><div>SKU</div><div>Producto</div><div>Tienda</div><div class="r">Piezas</div><div class="r">Valor a costo</div></div><div style="max-height:360px;overflow-y:auto">' +
      C.news.slice(0, 200).map(function (r, j) { return '<div class="tr" style="animation-delay:' + Math.min(j, 12) * 40 + 'ms"><div class="num sub">' + (j + 1) + '</div>' + skuBtn(r.k) + '<div class="ell" title="' + esc(D.tit[r.k]) + '">' + esc(D.tit[r.k] || '—') + '</div>' + storeCell(r.st, 'pzs', 'Tiendas con existencia') + '<div class="r num"><b>' + pz(r.q) + '</b> pzs</div><div class="r num">' + money(r.v) + '</div></div>'; }).join('') + '</div></div></div>';
    else h += '<div class="empty">No hay SKU nuevos para los filtros seleccionados.</div>';
    h += '</section>';
  }


  /* ¿Qué está pasando? */
  var st = [], scope = (S.mode === 'erp' ? 'ERP' + subLbl.toLowerCase() : S.mode === 'plat' ? 'Plataformas' : 'ERP y Plataformas') + (C.tUse ? ' (' + C.tAll.filter(function (o) { return C.tS[o.v]; }).map(function (o) { return o.label; }).join(', ') + ')' : '');
  function P(h2, t, c) { st.push('<div><i style="background:' + (c || 'var(--ink)') + '"></i><div><b style="color:' + (c === 'var(--out)' ? '#8A3A07' : 'var(--ink)') + '">' + h2 + '. </b>' + t + '</div></div>'); }
  P('Situación actual', 'Al ' + dl(d1) + ' el inventario de ' + esc(scope) + ' suma <b class="num">' + pz(cu) + ' piezas</b> con un valor a costo de <b class="num">' + money(cv) + '</b>.');
  if (pv >= 0) {
    var P1 = C.span(pv, d1), du2 = cu - invU[pv], dv2 = cv - invV[pv];
    P('Contra el corte anterior', 'Respecto al ' + dl(pv) + ' el inventario ' + (du2 > 0 ? 'aumentó' : du2 < 0 ? 'disminuyó' : 'se mantuvo') + ' <b class="num">' + sg(du2) + ' piezas</b> (' + pcs(invU[pv] ? du2 / invU[pv] * 100 : 0) + ') y el valor ' + (dv2 >= 0 ? 'subió ' : 'bajó ') + '<b class="num">' + money(Math.abs(dv2)) + '</b>. Entraron ' + pz(P1.e) + ' pzs (' + money(P1.ve) + ') y salieron ' + pz(P1.s) + ' pzs (' + money(P1.vs) + ').');
  }
  var ubs = Object.keys(C.byUb).map(Number).filter(function (k) { return C.byUb[k].v > 0; }).sort(function (a, b) { return C.byUb[b].v - C.byUb[a].v; }), tUb = ubs.reduce(function (a, k) { return a + C.byUb[k].v; }, 0);
  if (ubs.length) {
    var hub = ubs.filter(function (k) { return /hub|proveedor/i.test(D.dims.u[k]); }).map(function (k) { return D.dims.u[k] + ' ' + pz(C.byUb[k].q) + ' pzs (' + money(C.byUb[k].v) + ')'; });
    P('Ubicaciones ERP', esc(D.dims.u[ubs[0]]) + ' concentra el mayor valor con <b class="num">' + money(C.byUb[ubs[0]].v) + '</b> y ' + pz(C.byUb[ubs[0]].q) + ' pzs (' + (C.byUb[ubs[0]].v / tUb * 100).toFixed(2) + '%).' + (hub.length ? ' ' + esc(hub.join(' · ')) + '.' : ''));
  }
  var ess = Object.keys(C.byEs).map(Number).filter(function (k) { return C.byEs[k].q > 0 || C.byEs[k].v > 0; }), tEq = ess.reduce(function (a, k) { return a + C.byEs[k].q; }, 0), tEv = ess.reduce(function (a, k) { return a + C.byEs[k].v; }, 0);
  if (ess.length) {
    var apt = ess.filter(function (k) { return /^aptas?/i.test(D.dims.u[k]); })[0], nap = ess.filter(function (k) { return /^no aptas?/i.test(D.dims.u[k]); })[0];
    P('Estatus en Plataformas', (apt != null ? 'Aptas para vender: <b class="num">' + pz(C.byEs[apt].q) + ' pzs</b> (' + money(C.byEs[apt].v) + ', ' + (tEq ? C.byEs[apt].q / tEq * 100 : 0).toFixed(2) + '% de las piezas). ' : '') + (nap != null ? 'No aptas: ' + pz(C.byEs[nap].q) + ' pzs (' + money(C.byEs[nap].v) + ', ' + (tEv ? C.byEs[nap].v / tEv * 100 : 0).toFixed(2) + '% del valor).' : ''));
  }
  if (pv >= 0) P('Nuevos SKU', C.news.length ? 'Entraron <b class="num">' + nf.format(C.news.length) + ' SKU</b> sin existencia el ' + dl(pv) + ': ' + pz(nq) + ' pzs por ' + money(nv) + '; el de mayor valor es ' + esc(D.skus[C.news[0].k]) + ' (' + money(C.news[0].v) + ').' : 'No hay SKU nuevos respecto al corte anterior.');
  var sk = Object.keys(C.bySku).map(function (k) { return C.bySku[k]; }), topS = sk.slice().sort(function (a, b) { return b.vs - a.vs; })[0];
  if (topS && topS.s > 0) P('Mayor salida', 'Entre el ' + dl(C.ps) + ' y el ' + dl(d1) + ' el SKU con más valor de salidas es ' + esc(D.skus[topS.k]) + ' (' + esc((D.tit[topS.k] || '').slice(0, 44)) + '): ' + pz(topS.s) + ' pzs por ' + money(topS.vs) + '.');
  /* baja rotación */
  var LR = E.lowRot(C), lst = LR.list, nZ = LR.nZ, nL = LR.nL, vS = LR.vS;
  P('Atención', '<b class="num">' + nf.format(nZ) + '</b> SKU sin salidas y <b class="num">' + nf.format(nL) + '</b> con rotación menor al 5% en el periodo: <b class="num">' + money(vS) + '</b> a costo detenido (' + (cv ? vS / cv * 100 : 0).toFixed(2) + '% del valor).', 'var(--out)');
  h += '<section class="card sec" aria-label="Qué está pasando"><div class="sechead"><div class="l"><h2 class="tag">¿Qué está pasando con el inventario?</h2><span class="sub">Resumen automático con piezas y valor según los filtros y fechas</span></div></div><div class="story">' + st.join('') + '</div></section>';

  /* tendencia */
  var uv = sel.map(function (k) { return invU[k]; }), vv = sel.map(function (k) { return invV[k]; });
  var tips = sel.map(function (k, j) {
    var pk = j > 0 ? sel[j - 1] : null, t = '<div class="h">' + dl(k) + ' ' + D.dates[k].slice(0, 4) + ' · ' + dow(k) + '</div><div class="l"><span>Piezas</span><b>' + pz(invU[k]) + '</b></div><div class="l"><span>Valor a costo</span><b>' + money(invV[k]) + '</b></div>';
    if (pk != null) { var a = invU[k] - invU[pk], b = invV[k] - invV[pk]; t += '<div class="sp">vs ' + dl(pk) + '</div><div class="l"><span style="color:' + (a > 0 ? '#7FD3C8' : a < 0 ? '#FFB08A' : '#CFCFCF') + '">' + arrow(a) + ' ' + sg(a) + ' pzs</span><span style="color:' + (b > 0 ? '#7FD3C8' : b < 0 ? '#FFB08A' : '#CFCFCF') + '">' + sgm(b) + '</span></div>'; }
    return t; });
  h += '<section class="card sec" aria-label="Tendencia"><div class="sechead"><div class="l"><h2 class="tag b">Tendencia de inventario</h2><span class="sub">Piezas y valor a costo por corte · pasa el cursor para ver el detalle</span></div><div style="display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--ink2)"><span style="display:flex;gap:6px;align-items:center"><span class="sw" style="background:var(--navy)"></span>Unidades (barras · eje izq.)</span><span style="display:flex;gap:6px;align-items:center"><span class="sw" style="background:var(--gold);height:4px;border-radius:2px"></span>Valor a costo (línea · eje der.)</span></div></div><div class="trendwrap tcard" id="trend">' + comboChart(uv, vv, C, tips) + '</div></section>';

  /* comparativa */
  var cmpRows = [];
  if (pv >= 0) {
    var pp = prevOfSafe(C, pv), hp = pp >= 0, PC = C.span(pv, d1), PP = hp ? C.span(pp, pv) : null;
    function row(label, cq, cvv, pq, pvv, hasP, unit) { return { label: label, cq: cq, cv: cvv, pq: pq, pv: pvv, has: hasP, unit: unit || 'pzs' }; }
    var a0 = C.A(eb, d1), a0p = C.A(eb, pv), a1 = C.A(1, d1), a1p = C.A(1, pv);
    cmpRows = [row('Inventario ERP' + subLbl, a0.q, a0.v, a0p.q, a0p.v, true), row('Inventario Plataformas', a1.q, a1.v, a1p.q, a1p.v, true),
      row('Entradas del periodo', PC.e, PC.ve, PP && PP.e, PP && PP.ve, hp), row('Salidas del periodo', PC.s, PC.vs, PP && PP.s, PP && PP.vs, hp),
      row('SKU con movimiento', PC.n, PC.ve + PC.vs, PP && PP.n, PP && (PP.ve + PP.vs), hp, 'SKU')];
  }
  h += '<section class="card sec" style="border-left:5px solid var(--red)" aria-label="Comparativa"><div class="sechead"><div class="l"><h2 class="tag">Comparativa vs día anterior</h2>' + (pv >= 0 ? '<span class="big" style="font-size:18px">' + dl(d1) + ' vs ' + dl(pv) + '</span>' : '') + '</div></div>';
  if (pv < 0) h += '<div class="sub" style="font-size:13px">No hay un corte anterior para comparar con el filtro actual.</div>';
  else {
    h += '<div class="sub">Existencias al ' + dl(d1) + ' contra el corte anterior (' + dl(pv) + '). Cada métrica muestra piezas y valor a costo.</div><div class="tw"><div class="tb" style="--cols:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1.1fr) 110px;--mw:820px"><div class="th"><div>Métrica</div><div class="r">Anterior · ' + dl(pv) + '</div><div class="r">Actual · ' + dl(d1) + '</div><div class="r">Variación</div><div class="r">%</div></div>' +
      cmpRows.map(function (r, j) {
        var dq = r.cq - (r.has ? r.pq : 0), dvv = r.cv - (r.has ? r.pv : 0), pq = r.has && r.pq ? dq / Math.abs(r.pq) * 100 : 0, pvp = r.has && r.pv ? dvv / Math.abs(r.pv) * 100 : 0;
        var money$ = r.unit === 'SKU' ? 'valor movido ' : '';
        var w = Math.min(100, Math.max(r.has ? 3 : 0, Math.abs(pq))).toFixed(1), col = dq > 0 ? 'var(--in-t)' : dq < 0 ? 'var(--out-t)' : 'var(--muted)', bg = dq > 0 ? '#E3F5F2' : dq < 0 ? '#FFF1EA' : '#F1F2F4';
        return '<div class="tr" style="animation-delay:' + (100 + j * 80) + 'ms"><div style="font-weight:500">' + esc(r.label) + '</div>' +
          '<div class="r">' + (r.has ? two(pz(r.pq), money$ + money(r.pv), r.unit) : '<span class="sub">—</span>') + '</div><div class="r">' + two(pz(r.cq), money$ + money(r.cv), r.unit) + '</div>' +
          (r.has ? '<div class="two"><span class="badge num" style="color:' + col + ';background:' + bg + '">' + arrow(dq) + ' ' + sg(dq).replace(/^\+/, '+') + ' ' + r.unit + '</span><small class="num" style="color:' + col + ';font-weight:600">' + sgm(dvv) + '</small></div><div class="two" style="color:' + col + ';font-weight:600"><span class="num">' + (r.pq ? pcs(pq) : 'n/d') + '</span><small class="num" style="color:' + col + '">' + (r.pv ? pcs(pvp) : 'n/d') + '</small><div class="pctbar"><i style="width:' + w + '%;background:' + col + ';animation-delay:' + (450 + j * 80) + 'ms"></i></div></div>' : '<div class="r sub">Sin corte previo</div><div></div>') + '</div>';
      }).join('') + '</div></div>';
  }
  h += '</section>';

  /* ubicación ERP, almacén y estatus plataformas */
  h += '<section class="card sec" aria-label="Ubicación ERP"><div class="sechead"><div class="l"><h2 class="tag v">Inventario por ubicación (ERP)</h2><span class="sub">HUB, Proveedores, General, Ventas… · piezas y valor al ' + dl(d1) + subLbl + ' · clic para filtrar</span></div></div>' +
    barlist(C.byUb, function (k) { return D.dims.u[k]; }, 'pu', function (k) { return S.us.length === 1 && S.us[0] === k; }, S.mode === 'plat' ? 'La ubicación aplica al ERP; elige Todos o ERP.' : 'Sin inventario en ubicaciones para los filtros seleccionados.') + '</section>';
  h += donutSection('v', 'Inventario por almacén (ERP)', 'Piezas y valor al ' + dl(d1) + subLbl + ' · clic para filtrar', C.byAl, function (k) { return D.dims.ch[k]; }, 'pa', function (k) { return S.ch === k; }, 'a', S.mode === 'plat' ? 'Los almacenes aplican al ERP; elige Todos o ERP.' : 'Sin inventario en almacenes para los filtros seleccionados.');
  h += '<section class="card sec" aria-label="Estatus Plataformas"><div class="sechead"><div class="l"><h2 class="tag n">Inventario por estatus (Plataformas)</h2><span class="sub">Aptas para vender, no aptas, en revisión, en transferencia… · piezas y valor al ' + dl(d1) + ' · clic para filtrar</span></div></div>' +
    barlist(C.byEs, function (k) { return D.dims.u[k]; }, 'pu', function (k) { return S.us.length === 1 && S.us[0] === k; }, S.mode === 'erp' ? 'Los estatus aplican a Plataformas; elige Todos o Plataformas.' : 'Sin inventario para los filtros seleccionados.').replace('<div>Ubicación</div>', '<div>Estatus</div>') + '</section>';

  h += K.movSection(S, C);
  h += K.lowRotSection(S, C, LR);

  h += '<footer>El inventario no incluye ' + esc(D.meta && D.meta.excluido ? D.meta.excluido.estatus.join(', ') : '') + ' (Plataformas). Movimiento = variación de existencias por SKU, tienda, plataforma/almacén y estatus entre cortes consecutivos (aumento = entrada, disminución = salida), valorizada al costo promedio. Si eliges un solo corte, el periodo se mide contra el corte anterior. Valores a costo; Nuevos SKU y Baja rotación consideran fuente, tienda, categoría y búsqueda de SKU. Disponible y reservado existen solo para el corte con datos.</footer></div>';

  app.innerHTML = h;
  window.scrollTo(0, scrollY);
}
function prevOfSafe(C, i) { var k = C.sel.indexOf(i); return k > 0 ? C.sel[k - 1] : i - 1; }

K.wire({ app: app, tip: tip, S: S, setS: setS, E: E });

render();
setTimeout(function () { app.classList.remove('first'); }, 2200);
})();
</script>
</body>
</html>
