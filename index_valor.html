<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concentración del valor del inventario · selectshop</title>
<link rel="stylesheet" href="css/valor.css?v=202610252214">
</head>
<body>
<div id="app"></div>
<script src="data/dashboard_data.js?v=202610252214"></script>
<script src="js/engine.js?v=202610252214"></script>
<script>
/* Concentración del valor del inventario: total → almacén / canal → categoría → SKU.
   Cálculo: js/engine.js (valor, concentracion, validar, ficha) sobre data/dashboard_data.js (generado por scripts/generar_datos.py).
   Este archivo solo maneja el estado de navegación y dibuja. */
(function () {
'use strict';
var D = window.DASHBOARD_DATA, E = InvEngine.create(D), app = document.getElementById('app'), ND = D.dates.length;
var S = { fus: [], chs: [], ts: [], ms: null, view: 'inv', sq: '', sp: 50, exp: {}, d: ND - 1, tab: 'alm', fu: -1, c: -1, q: '', sort: 'v', dir: -1, page: 100, ficha: null, alert: null, allCats: false };
var nf = new Intl.NumberFormat('es-MX'), mf = new Intl.NumberFormat('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
function pz(n) { return nf.format(Math.round(n)); }
function full(n) { return '$' + mf.format(n); }
function M(n) { return '$' + mf.format(n / 1e6) + ' M'; }
function mm(n) { return '<span title="' + full(n) + '">' + M(n) + '</span>'; }
function pc(a, b) { return b > 0 ? mf.format(a / b * 100) + '%' : '—'; }
function sgn(n) { return (n > 0 ? '+' : n < 0 ? '−' : '') + nf.format(Math.abs(Math.round(n))); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function dl(i) { var t = D.dates[i].split('-'); return t[2] + '/' + t[1] + '/' + t[0]; }
function chName(i) { return D.dims.ch[i]; }
function catName(i) { return D.dims.c[i]; }
function srcOfCh(ch, V) { return V.alm.some(function (a) { return a.ch === ch; }) ? 0 : V.can.some(function (a) { return a.ch === ch; }) ? 1 : (D.st.some(function (r) { return r[1] === ch && r[0] === 0; }) ? 0 : 1); }

/* ---------- datos del estado actual ---------- */
S.ds = D.dates.map(function (x, i) { return i; });
function setD() { S.d = Math.max.apply(null, S.ds); }
function allDs() { return D.dates.map(function (x, i) { return i; }); }
function perLabel() {
  var s = S.ds.slice().sort(function (a, b) { return a - b; });
  if (s.length === ND) return dl(0) + ' → ' + dl(ND - 1);
  if (s.length === 1) return dl(s[0]);
  return s.length <= 4 ? s.map(dd).join(', ') : dd(s[0]) + ' … ' + dd(s[s.length - 1]) + ' (' + s.length + ' cortes)';
}
function U() { return { fuente: S.fu, t: S.ts }; }
function setFu() { S.fu = S.fus.length === 1 ? S.fus[0] : -1; }
function chText() { return S.chs.length <= 2 ? S.chs.map(chName).join(' + ') : S.chs.length + ' almacenes / canales'; }
function chCtx(V) { return S.chs.length === 1 ? (srcOfCh(S.chs[0], V) === 0 ? 'almacén ' : 'canal ') + chName(S.chs[0]) : S.chs.length ? chText() : 'inventario total'; }
function model() {
  var base = E.valor(S.d, {}, U()), F = {};
  if (S.chs.length) F.ch = S.chs;
  if (S.c >= 0) F.c = S.c;
  var V = (S.chs.length || S.c >= 0) ? E.valor(S.d, F, U()) : base;
  /* categorías dentro de la selección de almacén/canal (sin elegir categoría) para poder mostrar el ranking completo aunque haya una categoría elegida */
  var Vc = S.c >= 0 ? E.valor(S.d, S.chs.length ? { ch: S.chs } : {}, U()) : V;
  return { base: base, V: V, Vc: Vc, F: F };
}

/* ---------- piezas de interfaz ---------- */
function section(n, title, sub, body, extra) {
  return '<section class="card sec"><div class="sh"><h2><span class="n">' + n + '</span>' + esc(title) + '</h2><span class="sub">' + sub + '</span></div>' + (extra || '') + body + '</section>';
}
function bar(v, tot, cls) { var p = tot > 0 ? Math.max(0, Math.min(100, v / tot * 100)) : 0; return '<div class="bar ' + (cls || '') + '"><i style="width:' + p + '%"></i><b class="num">' + pc(v, tot) + '</b></div>'; }
function table(cols, head, rows, mw) {
  return '<div class="tw"><div class="t" style="--cols:' + cols + ';--mw:' + (mw || 640) + 'px"><div class="th">' + head.join('') + '</div>' + rows + '</div></div>';
}

function universo() { var a = []; if (S.fu >= 0) a.push(S.fu === 0 ? 'ERP' : 'Plataformas'); if (S.ts.length) a.push(S.ts.map(function (x) { return D.dims.t[x]; }).join(' + ')); return a.length ? ' · ' + esc(a.join(' · ')) : ''; }
function chk(k, id, text, on, sub) { return '<label class="mo"><input type="checkbox" data-a="mschk" data-k="' + k + '" value="' + id + '"' + (on ? ' checked' : '') + '><span class="mot">' + esc(text) + '</span>' + (sub ? '<span class="sub num">' + sub + '</span>' : '') + '</label>'; }
function msel(k, label, summary, body, n, hdr) {
  var open = S.ms === k;
  return '<div class="fl"><span>' + label + '</span><div class="ms' + (open ? ' open' : '') + '"><button class="msb" data-a="msopen" data-v="' + k + '" aria-haspopup="listbox" aria-expanded="' + open + '"><span class="mst">' + esc(summary) + '</span><span class="car">▾</span></button>' +
    (open ? '<div class="mp" role="group" aria-label="' + esc(label) + '"><div class="mph">' + (hdr || '<span>' + (n ? n + ' seleccionada' + (n === 1 ? '' : 's') : 'Sin selección = todas') + '</span><button class="lnk" data-a="msclear" data-v="' + k + '">Limpiar</button>') + '</div>' + body + '</div>' : '') + '</div></div>';
}
function filtros(m) {
  var V = m.base, tn = E.tiendas(S.d, S.fu);
  function opts(list) { return list.map(function (x) { return chk('ch', x.ch, chName(x.ch), S.chs.indexOf(x.ch) >= 0, M(x.v)); }).join(''); }
  var cb = (S.fu !== 1 && V.alm.length ? '<div class="mg">Almacenes (ERP)</div>' + opts(V.alm) : '') + (S.fu !== 0 && V.can.length ? '<div class="mg">Canales (Plataformas)</div>' + opts(V.can) : '');
  function sum(arr, names, todos) { return !arr.length ? todos : arr.length === 1 ? names(arr[0]) : arr.length + ' seleccionados'; }
  var dsum = S.ds.length === ND ? 'Todos los cortes (' + ND + ')' : S.ds.length === 1 ? 'Corte ' + dl(S.ds[0]) : S.ds.length + ' cortes · hasta ' + dd(S.d);
  var dbody = D.dates.map(function (x, k) { return k; }).reverse().map(function (k) { return chk('d', k, dl(k), S.ds.indexOf(k) >= 0); }).join('');
  var dhdr = '<span>' + S.ds.length + ' de ' + ND + '</span><span><button class="lnk" data-a="msall" data-v="d">Todos</button> <button class="lnk" data-a="mslast" data-v="d">Solo el último</button></span>';
  return '<div class="row3">' +
    msel('d', 'Fecha de corte', dsum, dbody, S.ds.length, dhdr) +
    msel('fu', 'Fuente', S.fus.length === 1 ? (S.fus[0] === 0 ? 'ERP' : 'Plataformas') : 'General', chk('fu', 0, 'ERP', S.fus.indexOf(0) >= 0) + chk('fu', 1, 'Plataformas', S.fus.indexOf(1) >= 0), S.fus.length) +
    msel('ch', 'Canal / almacén', sum(S.chs, chName, 'Todos'), cb, S.chs.length) +
    msel('t', 'Tienda', sum(S.ts, function (x) { return D.dims.t[x]; }, 'Todas'), tn.map(function (x) { return chk('t', x.t, x.name, S.ts.indexOf(x.t) >= 0, M(x.v)); }).join(''), S.ts.length) + '</div>';
}
function topBar(m) {
  var V = m.base, crumbs = '<button class="crumb' + (!S.chs.length && S.c < 0 && S.ficha == null ? ' cur' : '') + '" data-a="go" data-v="0">Inventario total</button>';
  if (S.chs.length) crumbs += '<span class="sep">›</span><button class="crumb' + (S.c < 0 && S.ficha == null ? ' cur' : '') + '" data-a="go" data-v="1" title="' + esc(chText()) + '">' + esc(S.chs.length === 1 ? (srcOfCh(S.chs[0], V) === 0 ? 'Almacén · ' : 'Canal · ') + chName(S.chs[0]) : chText()) + '</button>';
  if (S.c >= 0) crumbs += '<span class="sep">›</span><button class="crumb' + (S.ficha == null ? ' cur' : '') + '" data-a="go" data-v="2" title="' + esc(catName(S.c)) + '">' + esc('Categoría · ' + catName(S.c)) + '</button>';
  if (S.ficha != null) crumbs += '<span class="sep">›</span><button class="crumb cur" title="' + esc(D.skus[S.ficha]) + '">' + esc('SKU · ' + D.skus[S.ficha]) + '</button>';
  var deep = S.chs.length || S.c >= 0 || S.ficha != null;
  var dis = deep || S.q || S.fus.length || S.ts.length || S.ds.length < ND ? '' : ' disabled';
  return '<div class="strip"><img src="assets/arrows.webp" alt=""><div><h1>Inventario General</h1></div><img src="assets/arrows.webp" alt=""></div>' +
    '<div class="top"><div class="navb"><div class="in"><a class="brand" href="./" aria-label="selectshop"><img src="assets/logo_selectshop.webp" alt="selectshop"></a>' +
    '<div class="crumbs" aria-label="Ruta de navegación">' + (deep ? crumbs : '') + '</div>' +
    '<div class="tools">' +
    '<button class="tbtn" data-a="back"' + (deep ? '' : ' disabled') + '>← Nivel anterior</button><button class="tbtn" data-a="reset"' + dis + '>Restablecer filtros</button></div></div></div>' +
    '<div class="vtabs"><div class="in"><button data-a="view" data-v="inv" class="' + (S.view === 'inv' ? 'on' : '') + '">Inventario</button><button data-a="view" data-v="mov" class="' + (S.view === 'mov' ? 'on' : '') + '">Movimientos y advertencias</button></div></div>' +
    '<div class="filters"><div class="in">' + filtros(m) + '</div></div></div>';
}

function nivel1(m) {
  var V = m.base, SR = E.serie(S.d, U()), ss = S.ds.slice().sort(function (a, b) { return a - b; }), prevD = ss.length > 1 ? ss[ss.length - 2] : S.d - 1, p = ss.length > 1 ? E.valor(prevD, {}, U()).ref : V.prev;
  var avgSel = ss.reduce(function (a, k) { return a + SR.cortes[k].q; }, 0) / ss.length, dq = p ? V.ref.q - p.q : 0, dv = p ? V.ref.v - p.v : 0;
  var meta = D.meta && D.meta.generado ? D.meta.generado.replace('T', ' ') : '';
  var vr = p ? '<span class="v">' + (dv >= 0 ? '▲ ' : '▼ ') + '<span class="' + (dv >= 0 ? 'up' : 'dn') + '">' + (dv >= 0 ? '+' : '−') + mf.format(Math.abs(dv) / 1e6) + ' M</span></span><span class="s num ' + (dv >= 0 ? 'up' : 'dn') + '">' + (dv >= 0 ? '+' : '−') + mf.format(Math.abs(dv / p.v * 100)) + '% · ' + sgn(dq) + ' pzs</span><span class="s">vs corte ' + dl(prevD) + '</span>'
    : '<span class="v">—</span><span class="s">Sin corte anterior comparable</span>';
  function sv(L) { return L.reduce(function (s, x) { return s + x.v; }, 0); }
  var vE = sv(V.alm), vP = sv(V.can), rf = V.ref.v, top = V.cias[0], tA = V.alm[0], tC = V.can[0];
  function mini(l, v, s) { return '<div class="rs"><div class="rl">' + l + '</div><div class="rv num">' + v + '</div>' + (s ? '<div class="rn">' + s + '</div>' : '') + '</div>'; }
  var pE = rf ? vE / rf * 100 : 0;
  var how = '<div class="how"><div class="hh">Resumen del inventario</div><div class="rsg">' +
    '<div class="rs wide"><div class="rl">Composición por fuente</div><div class="rbar" title="ERP ' + pc(vE, rf) + ' · Plataformas ' + pc(vP, rf) + '"><i style="width:' + pE.toFixed(2) + '%"></i></div>' +
    '<div class="rlg"><span><i class="d1"></i>ERP <b class="num">' + M(vE) + '</b> · ' + pc(vE, rf) + '</span><span><i class="d2"></i>Plataformas <b class="num">' + M(vP) + '</b> · ' + pc(vP, rf) + '</span></div></div>' +
    (top ? mini('Mayor grupo', esc(top.n), M(top.v) + ' · ' + pc(top.v, rf) + ' del total') : '') +
    (tA ? mini('Mayor almacén (ERP)', esc(chName(tA.ch)), M(tA.v) + ' · ' + pc(tA.v, rf) + ' del total') : '') +
    (tC ? mini('Mayor canal (Plataformas)', esc(chName(tC.ch)), M(tC.v) + ' · ' + pc(tC.v, rf) + ' del total') : '') +
    '</div></div>';
  return section(1, 'Valor total del inventario', 'punto de partida: representa el 100% · el análisis se centra en el valor a costo',
    '<div class="kpis">' +
    '<div class="card kpi main"><div class="t">Valor del inventario</div><div class="v num" title="' + full(V.ref.v) + '">' + M(V.ref.v) + '</div><div class="s num">a costo · <b>' + pz(V.ref.q) + '</b> piezas</div></div>' +
    '<div class="card kpi"><div class="t">Variación vs corte anterior</div>' + vr + '</div>' +
    '<div class="card kpi"><div class="t">Piezas promedio</div><div class="v num">' + pz(avgSel) + '</div></div>' +
    '<div class="card kpi"><div class="t">Fecha de corte</div><div class="v num">' + dl(S.d) + '</div><div class="s">' + (S.ds.length > 1 ? S.ds.length + ' cortes seleccionados · ' : '') + 'actualizado: ' + esc(meta || 'sin dato') + '</div></div>'  + '</div>' + how);
}

function rankRows(list, V, kind) {
  var tot = V.ref.v, uni = list.reduce(function (a, x) { return a + x.v; }, 0), rows = '';
  list.forEach(function (x) {
    var on = S.chs.indexOf(x.ch) >= 0;
    var key = kind + '|' + x.ch, open = !!S.exp[key];
    rows += '<div class="tr click' + (on ? ' on' : '') + '" data-a="ch" data-v="' + x.ch + '" title="Clic para profundizar en ' + esc(chName(x.ch)) + '"><div class="ell"><button class="chev' + (open ? ' open' : '') + '" data-a="exp" data-v="' + key + '" aria-expanded="' + open + '" aria-label="' + (kind === 0 ? 'Ver ubicaciones de ' : 'Ver estatus de ') + esc(chName(x.ch)) + '" title="' + (kind === 0 ? 'Ver ubicaciones' : 'Ver estatus') + '">▸</button><b>' + esc(chName(x.ch)) + '</b></div><div class="r num">' + mm(x.v) + '</div><div class="r num sub">' + pz(x.q) + '</div>' +
      '<div>' + bar(x.v, tot, kind === 0 ? 'dark' : '') + '</div></div>';
    if (open) E.desglose(S.d, x.ch, kind, U()).forEach(function (d) {
      rows += '<div class="tr det"><div class="ell">' + esc(d.name) + ' <span class="sub">' + (kind === 0 ? 'ubicación' : 'estatus') + '</span></div><div class="r num">' + mm(d.v) + '</div><div class="r num sub">' + pz(d.q) + '</div><div>' + bar(d.v, tot, 'teal') + '</div></div>';
    });
  });
  rows += '<div class="tr tot"><div>Total ' + (kind === 0 ? 'ERP' : 'Plataformas') + '</div><div class="r num">' + mm(uni) + '</div><div class="r num">' + pz(list.reduce(function (a, x) { return a + x.q; }, 0)) + '</div><div class="num">' + pc(uni, tot) + ' del total</div></div>';
  return table('minmax(150px,1.4fr) minmax(0,.8fr) minmax(0,.9fr) minmax(160px,1.8fr)',
    ['<div>' + (kind === 0 ? 'Almacén' : 'Canal') + '</div>', '<div class="r">Valor</div>', '<div class="r">Piezas</div>', '<div>% del total de inventario</div>'], rows, 560);
}
function nivel2(m) {
  var V = m.base, tab = S.fu === 0 ? 'alm' : S.fu === 1 ? 'can' : S.tab;
  var tabs = S.fu >= 0 ? '' : '<div class="tabs" role="tablist"><button data-a="tab" data-v="alm" class="' + (tab === 'alm' ? 'on' : '') + '">Almacén (ERP)</button><button data-a="tab" data-v="can" class="' + (tab === 'can' ? 'on' : '') + '">Canal (Plataformas)</button></div>';
  var list = tab === 'alm' ? V.alm : V.can, kind = tab === 'alm' ? 0 : 1;
  var allOpen = list.length > 0 && list.every(function (x) { return S.exp[kind + '|' + x.ch]; });
  tabs = '<div class="tbar">' + tabs + (list.length ? '<button class="btn sm" data-a="expall" data-v="' + (allOpen ? 0 : 1) + '|' + tab + '">' + (allOpen ? '▾ Contraer todo' : '▸ Expandir todo') + '</button>' : '') + '</div>';
  return section(3, 'Concentración por almacén y canal', 'ordenado de mayor a menor valor · ▸ despliega ubicaciones (ERP) o estatus (Plataformas) · clic en la fila para profundizar',
    list.length ? rankRows(list, V, tab === 'alm' ? 0 : 1) : '<div class="empty">Sin ' + (tab === 'alm' ? 'almacenes' : 'canales') + ' para los filtros actuales.</div>', tabs);
}

function nivel3(m) {
  var V = m.Vc, ref = m.base.ref.v, parent = V.sel.v, rows = '', cum = 0;
  var ctx = chCtx(m.base);
  V.cats.forEach(function (c, ix) {
    cum += c.v; var on = S.c === c.c; if (!S.allCats && ix >= 15 && !on) return;
    rows += '<div class="tr click' + (on ? ' on' : '') + '" data-a="cat" data-v="' + c.c + '"><div class="ell"><b>' + esc(catName(c.c)) + '</b></div><div class="r num">' + mm(c.v) + '</div><div class="r num sub">' + pz(c.q) + '</div><div>' + bar(c.v, ref, 'orange') + '</div>' + (S.chs.length ? '<div class="r num">' + pc(c.v, parent) + '</div>' : '') + '</div>';
  });
  var hid = S.allCats ? 0 : V.cats.length - 15;
  if (hid > 0) rows += '<div class="tr"><div class="sub">… y ' + hid + ' categorías más, de menor valor</div></div>';
  rows += '<div class="tr tot"><div>Total ' + esc(ctx) + '</div><div class="r num">' + mm(parent) + '</div><div class="r num">' + pz(V.sel.q) + '</div><div class="num">' + pc(parent, ref) + ' del total</div>' + (S.chs.length ? '<div class="r num">100.00%</div>' : '') + '</div>';
  return section(5, 'Concentración por categoría', 'categorías que integran el ' + esc(ctx) + ' · porcentaje sobre el total de inventario' + (S.chs.length ? ' y sobre la selección' : '') + ' · clic para ver sus SKU',
    table('minmax(150px,1.5fr) minmax(0,.8fr) minmax(0,.9fr) minmax(160px,1.8fr)' + (S.chs.length ? ' minmax(0,.9fr)' : ''),
      ['<div>Categoría</div>', '<div class="r">Valor</div>', '<div class="r">Piezas</div>', '<div>% del total de inventario</div>'].concat(S.chs.length ? ['<div class="r">% de la selección</div>'] : []), rows, 600) + (V.cats.length > 15 ? '<div style="text-align:center"><button class="btn" data-a="cats">' + (S.allCats ? 'Mostrar solo las 15 principales' : 'Ver las ' + V.cats.length + ' categorías') + '</button></div>' : ''));
}

/* ---------- SKU ---------- */
function skuRows(m) {
  var V = m.V, parent = S.c >= 0 ? (m.Vc.cats.filter(function (c) { return c.c === S.c; })[0] || { v: 0 }).v : V.sel.v;
  var q = S.q.trim().toLowerCase(), list = V.skus.map(function (s) {
    var tit = D.tit[s.k] || '', locs = Object.keys(s.loc);
    return { s: s, sku: D.skus[s.k], tit: tit, cat: catName(s.c), loc: locs.length === 1 ? chName(+locs[0].split('|')[1]) : locs.length + ' ubicaciones', v: s.v, q: s.q, cu: s.cu, g: s.v, i: s.v, cum: s.cum };
  });
  if (q) list = list.filter(function (r) { return (r.sku + ' ' + r.tit).toLowerCase().indexOf(q) >= 0; });
  var k = S.sort, d = S.dir;
  list.sort(function (a, b) { var x = a[k], y = b[k]; if (typeof x === 'string') return d * x.localeCompare(y, 'es'); return d * (x - y) || b.v - a.v; });
  return { list: list, parent: parent };
}
function nivel4(m) {
  var R = skuRows(m), ref = m.base.ref.v, shown = R.list.slice(0, S.page), hasSel = S.chs.length || S.c >= 0;
  function th(k, label, right) { return '<div class="' + (right ? 'r ' : '') + 'sortable" data-a="sort" data-v="' + k + '">' + label + (S.sort === k ? (S.dir < 0 ? ' ▼' : ' ▲') : '') + '</div>'; }
  var rows = shown.map(function (r, i) {
    return '<div class="tr click" data-a="sku" data-v="' + r.s.k + '"><div class="num sub">' + r.s.rank + '</div><div class="ell"><b>' + esc(r.sku) + '</b></div><div class="ell" title="' + esc(r.tit) + '">' + esc(r.tit || 'Sin nombre en el concentrado') + '</div><div class="ell">' + esc(r.cat) + '</div><div class="ell" title="' + esc(r.loc) + '">' + esc(r.loc) + '</div>' +
      '<div class="r num">' + pz(r.q) + '</div><div class="r num">' + full(r.cu) + '</div><div class="r num">' + full(r.v) + '</div><div class="r num">' + pc(r.v, ref) + '</div>' + (hasSel ? '<div class="r num">' + pc(r.v, R.parent) + '</div>' : '') + '</div>';
  }).join('') || '<div class="empty">Sin SKU para la selección y la búsqueda actuales.</div>';
  var tq = R.list.reduce(function (a, r) { return a + r.q; }, 0), tv = R.list.reduce(function (a, r) { return a + r.v; }, 0);
  rows += '<div class="tr tot"><div></div><div>' + pz(R.list.length) + ' SKU' + (S.q ? ' (búsqueda)' : '') + '</div><div></div><div></div><div></div><div class="r num">' + pz(tq) + '</div><div class="r num">' + (tq ? full(tv / tq) : '—') + '</div><div class="r num">' + full(tv) + '</div><div class="r num">' + pc(tv, ref) + '</div>' + (hasSel ? '<div class="r num">' + pc(tv, R.parent) + '</div>' : '') + '</div>';

  if (p.get('q')) S.q = p.get('q');
  if (p.get('vista') === 'mov') S.view = 'mov';
  if (p.get('abrir')) p.get('abrir').split(',').forEach(function (n) { var i = D.dims.ch.indexOf(n.trim()); if (i >= 0) S.exp[(E.valor(S.d, {}).alm.some(function (x) { return x.ch === i; }) ? 0 : 1) + '|' + i] = true; });
  if (p.get('fuente')) { p.get('fuente').split(',').forEach(function (f) { if (f === 'erp') S.fus.push(0); else if (f === 'plat') S.fus.push(1); }); setFu(); }
  if (p.get('tienda')) p.get('tienda').split(',').forEach(function (n) { var ti = D.dims.t.indexOf(n.trim()); if (ti >= 0) S.ts.push(ti); });
})();
render();
})();
</script>
